# 本地随机端口，避免占用固定端口
server.port=0

# ===== 本地可观测性参数 =====
# 超时阈值（毫秒）：超过则判定为 TIMEOUT
observability.timeout-millis=1000
# 慢请求阈值（毫秒）：超过则标记 slow，但不算失败
observability.slow-request-millis=500
# 本地 JSON 导出目录
observability.export-dir=./observability-data
# 内存中最多保留的请求记录数（超出淘汰最旧）
observability.max-records=10000
# 后台调度默认关闭，需要演示/测试时显式打开
observability.scheduling-enabled=false
observability.schedule.fixed-delay=60000

# 日志中输出 traceId，便于把日志与链路关联
logging.pattern.level=%5p [${TRACE_ID:-no-trace}]
